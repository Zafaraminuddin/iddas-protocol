name: Attach mobile stylesheet

on:
  push:
    branches:
      - fix/mobile-layout-2026-09-07
    paths:
      - .github/workflows/attach-mobile-stylesheet.yml

permissions:
  contents: write

jobs:
  attach-mobile-stylesheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-layout-2026-09-07
          fetch-depth: 0

      - name: Attach responsive stylesheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          tag = '<link rel="stylesheet" href="mobile-fix.css"/>'
          if tag not in html:
              html = html.replace("</head>", tag + "\n</head>", 1)
              path.write_text(html, encoding="utf-8")
          PY

      - name: Commit repaired page
        shell: bash
        run: |
          rm -f .github/workflows/attach-mobile-stylesheet.yml
          git config user.name "IDDAS Mobile Repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html mobile-fix.css .github/workflows/attach-mobile-stylesheet.yml
          git diff --cached --quiet || git commit -m "Fix mobile layout, navigation, and sections"
          git push origin HEAD:fix/mobile-layout-2026-09-07
