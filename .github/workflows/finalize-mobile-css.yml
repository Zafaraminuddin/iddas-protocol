name: Finalize mobile CSS cascade

on:
  push:
    branches:
      - fix/mobile-layout-2026-09-07
    paths:
      - .github/workflows/finalize-mobile-css.yml

permissions:
  contents: write

jobs:
  finalize-mobile-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-layout-2026-09-07
          fetch-depth: 0

      - name: Move mobile repair to final cascade position
        shell: python
        run: |
          from pathlib import Path

          page = Path("index.html")
          css_file = Path("mobile-fix.css")
          html = page.read_text(encoding="utf-8")
          css = css_file.read_text(encoding="utf-8")

          head_link = '<link rel="stylesheet" href="mobile-fix.css"/>'
          html = html.replace(head_link, "")

          start_marker = '<style id="iddas-mobile-repair">'
          end_marker = '</style><!-- /iddas-mobile-repair -->'

          if start_marker in html:
              before, rest = html.split(start_marker, 1)
              _, after = rest.split(end_marker, 1)
              html = before + after

          final_block = '\n<style id="iddas-mobile-repair">\n' + css + '\n</style><!-- /iddas-mobile-repair -->\n'
          if "</body>" not in html:
              raise SystemExit("Closing body tag not found")
          html = html.replace("</body>", final_block + "</body>", 1)
          page.write_text(html, encoding="utf-8")

      - name: Commit final branch state
        shell: bash
        run: |
          rm -f .github/workflows/finalize-mobile-css.yml
          git config user.name "IDDAS Mobile Repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html mobile-fix.css .github/workflows/finalize-mobile-css.yml
          git diff --cached --quiet || git commit -m "Finalize mobile responsive cascade"
          git push origin HEAD:fix/mobile-layout-2026-09-07
