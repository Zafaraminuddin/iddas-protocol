name: Apply mobile layout repair

on:
  push:
    branches:
      - fix/mobile-layout-2026-09-07
    paths:
      - .github/workflows/apply-mobile-layout-fix.yml

permissions:
  contents: write

jobs:
  patch-mobile-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-layout-2026-09-07
          fetch-depth: 0

      - name: Add final authoritative mobile styles
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = "IDDAS MOBILE REPAIR 2026-09-07"

          if marker in html:
              raise SystemExit("Mobile repair already present")

          css = r'''
<style>
/* IDDAS MOBILE REPAIR 2026-09-07
   Final mobile overrides. Desktop layout remains unchanged. */
@media (max-width: 900px) {
  html,
  body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    padding-left: 14px !important;
    padding-right: 14px !important;
  }

  .top {
    width: 100%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: flex-start;
    gap: 10px;
    padding: 10px 54px 8px 0;
  }

  .brand {
    width: fit-content;
    max-width: 100%;
    min-width: 0;
  }

  .brand img {
    height: 48px !important;
    width: auto !important;
    max-width: 100%;
  }

  /* Mobile navigation uses the existing Jump control instead of
     forcing the full desktop link row into a phone viewport. */
  .nav {
    width: 100%;
    min-width: 0;
    display: block;
    flex-wrap: wrap !important;
    overflow: visible;
  }

  .nav > a {
    display: none;
  }

  .jumpNav {
    position: relative;
    display: block;
    width: 100%;
    max-width: 100%;
    min-width: 0 !important;
    margin: 0 !important;
    flex: 0 1 100%;
  }

  .jumpBtn {
    width: 100% !important;
    min-width: 0 !important;
    max-width: none !important;
    min-height: 44px;
    padding: 11px 14px !important;
    justify-content: space-between !important;
    white-space: normal;
  }

  .jumpPanel {
    left: 0 !important;
    right: 0 !important;
    transform: none !important;
    width: 100% !important;
    min-width: 0 !important;
    max-width: 100% !important;
    max-height: 62vh;
  }

  .jumpItem {
    min-height: 42px;
    display: flex;
    align-items: center;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  .site-search-btn {
    top: 12px;
    right: 12px;
    min-height: 40px;
  }

  /* Fixed-width and multi-column content becomes fluid. */
  .hero,
  .sectionGrid,
  .grid,
  .protoLayout,
  .siteFooter .footerInner {
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  .hero {
    grid-template-columns: minmax(0, 1fr) !important;
    gap: 14px;
  }

  .sectionGrid {
    grid-template-columns: minmax(0, 1fr) !important;
  }

  .grid {
    grid-template-columns: minmax(0, 1fr) !important;
  }

  .grid > *,
  .sectionGrid > section,
  .span-4,
  .span-5,
  .span-6,
  .span-7,
  .span-8,
  .span-12 {
    grid-column: 1 / -1 !important;
    min-width: 0;
    max-width: 100%;
  }

  .heroCard,
  .sideCard,
  .iddas-callout,
  .card,
  .callout,
  details.siteAccordion,
  .protoWrap,
  .protocol-summary {
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }

  .heroCard,
  .sideCard {
    padding: 18px;
  }

  .sectionHead {
    min-width: 0;
    max-width: 100%;
    flex-wrap: wrap;
  }

  .sectionHead h2,
  .sectionHead h3,
  .siteAccordionSummary,
  .siteAccordionSummary *,
  .card,
  .card *,
  .protoWrap,
  .protoWrap * {
    min-width: 0;
    overflow-wrap: anywhere;
    word-break: normal;
  }

  .siteAccordionSummary {
    width: 100%;
    max-width: 100%;
    grid-template-columns: minmax(0, 1fr) auto !important;
    column-gap: 12px;
    row-gap: 7px;
    padding: 18px !important;
  }

  .siteAccordionSummary .sectionHead,
  .siteAccordionSummary .secHead,
  .siteAccordionSummary .hint {
    grid-column: 1 !important;
    max-width: 100%;
  }

  .siteAccordionSummary .hint {
    justify-self: start !important;
    margin: 0 !important;
    text-align: left !important;
  }

  .siteAccordionSummary::after {
    grid-column: 2 !important;
    grid-row: 1 / span 2 !important;
    align-self: center;
  }

  #what > details.siteAccordion > summary.siteAccordionSummary {
    padding-top: 22px !important;
    padding-bottom: 22px !important;
  }

  .siteAccordionBody,
  .usecases-details .usecaseBody,
  #usecases details.siteAccordion > .grid.usecases-details,
  #usecases details.siteAccordion > p.sub {
    padding-left: 16px !important;
    padding-right: 16px !important;
  }

  /* The ID-specific desktop rule previously beat the older mobile rule. */
  #accordionControls.floatingControls {
    position: static !important;
    top: auto !important;
    right: auto !important;
    bottom: auto !important;
    left: auto !important;
    transform: none !important;
    z-index: auto !important;
    width: 100% !important;
    max-width: 100%;
    display: flex !important;
    flex-direction: row !important;
    flex-wrap: wrap !important;
    align-items: center !important;
    justify-content: flex-start !important;
    gap: 8px !important;
    margin: 10px 0 8px !important;
  }

  #accordionControls.floatingControls .pillButton,
  #accordionControls.floatingControls button,
  #accordionControls.floatingControls a {
    white-space: normal;
    min-height: 42px;
  }

  /* Protocol section no longer preserves its 220px desktop side rail. */
  .protoLayout {
    flex-direction: column !important;
  }

  .protoNav,
  .protoLayout.proto-nav-hidden .protoNav {
    position: static !important;
    top: auto !important;
    width: 100% !important;
    min-width: 0 !important;
    max-width: 100% !important;
    flex: none !important;
    max-height: 46vh;
    overflow: auto !important;
    padding: 10px !important;
  }

  .protoLayout.proto-nav-hidden .protoNavTitle,
  .protoLayout.proto-nav-hidden .protoNavLinks {
    display: none;
  }

  #jumpNavToggle {
    width: 100% !important;
    min-width: 0 !important;
  }

  .protoNavLinks {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  .protoNav a,
  .protoNavLinks a.protoManualSub {
    width: 100%;
    max-width: 100%;
    margin-left: 0 !important;
    white-space: normal;
  }

  .protoScroll {
    max-width: 100%;
    overflow-x: hidden;
  }

  .protoWrap.isFull {
    top: 2vh !important;
    left: 2vw !important;
    right: 2vw !important;
    bottom: 2vh !important;
  }

  .protoWrap.isFull .protoLayout.proto-nav-hidden #jumpNavToggle {
    position: static !important;
    left: auto !important;
    top: auto !important;
    width: 100% !important;
  }

  #devNoticeOverlay {
    padding: 14px;
  }

  #devNoticeBox {
    width: 100%;
    max-width: 640px;
    max-height: calc(100vh - 28px);
    overflow: auto;
    padding: 20px 18px;
  }

  .site-search-modal {
    padding: 12px;
  }

  .site-search-card {
    width: 100%;
    max-width: 100%;
    margin-top: 52px;
  }

  img,
  svg,
  video,
  canvas,
  iframe {
    max-width: 100%;
    height: auto;
  }

  table {
    display: block;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  pre,
  code {
    max-width: 100%;
  }

  pre {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .betweenNote,
  .allocationNote,
  .midnote,
  .footDisclaimer {
    max-width: 100%;
  }
}

@media (max-width: 520px) {
  .wrap {
    padding-left: 12px !important;
    padding-right: 12px !important;
  }

  .top {
    padding-right: 50px;
  }

  .brand img {
    height: 42px !important;
  }

  h1 {
    font-size: clamp(25px, 8vw, 30px) !important;
    line-height: 1.08;
    overflow-wrap: anywhere;
  }

  .kicker {
    font-size: 11px;
    letter-spacing: .13em;
  }

  .heroCard,
  .sideCard,
  .iddas-callout {
    padding: 16px;
    border-radius: 16px;
  }

  .siteAccordionSummary {
    padding: 16px !important;
  }

  .siteAccordionBody {
    padding: 14px 16px 18px !important;
  }

  .pillRow {
    gap: 7px;
  }

  .pill {
    max-width: 100%;
    white-space: normal;
  }

  .backToTop {
    right: 10px;
    bottom: 10px;
    padding: 7px 10px;
  }
}
</style>
'''

          if "</head>" not in html:
              raise SystemExit("Could not find closing head tag")

          html = html.replace("</head>", css + "\n</head>", 1)
          path.write_text(html, encoding="utf-8")

      - name: Commit the repaired page and remove this one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-mobile-layout-fix.yml
          git config user.name "IDDAS Mobile Repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-mobile-layout-fix.yml
          git commit -m "Fix mobile layout, navigation, and sections"
          git push origin HEAD:fix/mobile-layout-2026-09-07
